<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Workshop Registration</title>

    

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="registration-container">

        <h1>Developer Workshop Registration</h1>

        <p class="intro">

            Join our workshop to learn, build, and improve your development skills.

            Complete the form below to register.

        </p>

        <form action="#" method="post">

            <div class="form-group">

                <label for="fullname">Full Name</label>

                <input

                    type="text"

                    id="fullname"

                    name="fullname"

                    placeholder="Enter your full name"

                    required

                >

            </div>

            <div class="form-group">

                <label for="email">Email Address</label>

                <input

                    type="email"

                    id="email"

                    name="email"

                    placeholder="Enter your email address"

                    required

                >

            </div>

            <div class="form-group">

                <label for="experience">Experience Level</label>

                <select id="experience" name="experience" required>

                    <option value="">Select your experience level</option>

                    <option value="beginner">Beginner</option>

                    <option value="intermediate">Intermediate</option>

                    <option value="advanced">Advanced</option>

                </select>

            </div>

            <fieldset class="form-group">

                <legend>Choose Your Workshop</legend>

                <label class="option">

                    <input type="radio" name="workshop" value="web-development" required>

                    Web Development

                </label>

                <label class="option">

                    <input type="radio" name="workshop" value="cybersecurity">

                    Cybersecurity

                </label>

                <label class="option">

                    <input type="radio" name="workshop" value="data-science">

                    Data Science

                </label>

            </fieldset>

            <div class="notification">

                <label class="option">

                    <input type="checkbox" id="notifications" name="notifications">

                    Send me workshop updates and notifications

                </label>

            </div>

            <button type="submit">Register Now</button>

        </form>

    </main>

</body>

</html>
